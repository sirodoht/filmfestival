name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check deployment scripts
        run: bash -n deploy/*.sh

      - name: Check for obsolete application commands
        run: |
          if grep -RInE 'manage\.py|gunicorn|uv run|collectstatic|migrate' deploy .github/workflows/deploy.yml; then
              echo "Found a command from the old Django deployment"
              exit 1
          fi
